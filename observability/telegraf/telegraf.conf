# Telegraf base. Inputs live in telegraf.d/:
#   static/     conf.d in the repo  — netflow listeners, processors, outputs
#   generated/  written by render-inventory.py — SNMP and gNMI per platform
#
# Telegraf expands ${VAR} from the container environment, which is why the
# generated files can reference ${SNMPV3_AUTH} without ever containing it.

[agent]
  interval = "${SNMP_INTERVAL}"
  round_interval = true

  # SIZED FOR THE FLEET, NOT THE DEMO.
  # 400 devices x ~30 interfaces produces roughly 105,000 metrics per interval.
  # metric_buffer_limit must exceed one full interval's output, or a single
  # slow flush to Prometheus silently drops the excess — Telegraf logs one
  # "metric buffer overflow" line and carries on. 250k gives ~2 intervals of
  # headroom at the documented ceiling.
  metric_batch_size = 10000
  metric_buffer_limit = 250000

  # Jitter spreads the SNMP stampede: without it every agent is polled in the
  # same instant each interval, which spikes CPU and the device's own CPU too.
  collection_jitter = "5s"
  flush_interval = "10s"
  flush_jitter = "3s"

  omit_hostname = true          # the container's hostname is noise; `device` is the identity

  # Pinned deliberately. Telegraf 1.40 flips this default to `true`, which
  # would silently stop running processors after aggregators — and the flow
  # pipeline in netflow.conf renames fields AFTER basicstats aggregates them.
  # With the new default those renames would be skipped and flow_bytes_total
  # would quietly never appear.
  skip_processors_after_aggregators = false
