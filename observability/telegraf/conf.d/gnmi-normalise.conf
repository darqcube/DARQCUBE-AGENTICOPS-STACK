# gNMI reports interface state as strings ("UP"/"DOWN"); SNMP reports the
# IF-MIB integers (1/2). They are mapped to the SNMP values here so that a
# dashboard or alert never has to know which transport a device uses.
#
# This is what makes `interface_oper_status` mean one thing across the fleet.

[[processors.enum]]
  order = 5
  namepass = ["gnmi", "interface"]

  [[processors.enum.mapping]]
    field = "interface_oper_status"
    [processors.enum.mapping.value_mappings]
      UP = 1
      DOWN = 2
      TESTING = 3
      UNKNOWN = 4

  [[processors.enum.mapping]]
    field = "interface_admin_status"
    [processors.enum.mapping.value_mappings]
      UP = 1
      DOWN = 2
      TESTING = 3
