# Identity and output, shared by every input.
#
# ORDER MATTERS: processors run before outputs, so `device` is resolved from
# the source of truth before anything is exposed to Prometheus.

# Resolve the polled address to its Infrahub identity. The table is written by
# render-inventory.py and re-read automatically as it changes.
[[processors.lookup]]
  order = 1
  files = ["/etc/telegraf/telegraf.d/generated/devices.json"]
  format = "json"
  key = '{{ .Tag "agent_host" }}'

# Flow records arrive from the exporter's own source address, so they key on a
# different tag — same table, same resulting labels. A record from a dedicated
# listener (netflow-dedicated.conf, for exporters behind NAT) carries the
# device name in flow_exporter, which wins: its source address is the NAT's.
[[processors.lookup]]
  order = 2
  files = ["/etc/telegraf/telegraf.d/generated/devices.json"]
  format = "json"
  key = '{{ or (.Tag "flow_exporter") (.Tag "source") }}'

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  namedrop = ["netflow"]   # flows have their own output, below
  # How long a series stays exposed without a fresh sample. The default (60s)
  # equals SNMP_INTERVAL=60s, so a device whose poll finished a few seconds
  # late vanished until its next poll: counts flickered, "not reporting"
  # flashed, panels showed gaps. Must exceed the longest SNMP_INTERVAL plus a
  # full timeout x retries round (20 s). A dead device lingers up to this long.
  expiration_interval = "3m"
  collectors_exclude = ["gocollector", "process"]

# Flows: one value per 60 s window (netflow.conf), exposed with that window's
# own timestamp. Without it Prometheus stored the value at every scrape while it
# stayed exposed: twice for a steady flow, five or six times for a lone minute
# (held until expiration_interval), so no query could tell one busy minute from
# the same minute scraped again. With it each window is stored once, and
# sum_over_time(netflow_flow_bytes_total[w]) is the exact total over w.
[[outputs.prometheus_client]]
  listen = ":9274"
  metric_version = 2
  namepass = ["netflow"]
  export_timestamp = true
  expiration_interval = "3m"
  collectors_exclude = ["gocollector", "process"]
