# Identity and output, shared by every input.
#
# ORDER MATTERS: processors run before outputs, so `device` is resolved from
# the source of truth before anything is exposed to Prometheus.

# Resolve the polled address to its Infrahub identity. The table is written by
# render-inventory.py and re-read automatically as it changes.
[[processors.lookup]]
  order = 1
  files = ["/etc/telegraf/telegraf.d/generated/devices.json"]
  format = "json"
  key = '{{ .Tag "agent_host" }}'

# Flow records arrive from the exporter's own source address, so they key on a
# different tag — same table, same resulting labels. A record from a dedicated
# listener (netflow-dedicated.conf, for exporters behind NAT) carries the
# device name in flow_exporter, which wins: its source address is the NAT's.
[[processors.lookup]]
  order = 2
  files = ["/etc/telegraf/telegraf.d/generated/devices.json"]
  format = "json"
  key = '{{ or (.Tag "flow_exporter") (.Tag "source") }}'

[[outputs.prometheus_client]]
  listen = ":9273"
  metric_version = 2
  collectors_exclude = ["gocollector", "process"]
