# NetFlow v5/v9 and IPFIX.
#
# THE CARDINALITY PROBLEM, AND WHY THIS CONFIG LOOKS LOSSY
# A flow record carries src_ip, dst_ip, src_port, dst_port. As Prometheus
# labels that is unbounded — a busy link produces hundreds of thousands of
# series within hours and the TSDB falls over. So per-flow identity is dropped
# HERE, at the collector, and only bounded counters are emitted:
#
#     {device, site, role, protocol, direction}  ~=  a few dozen series/device
#
# The cost is explicit and worth knowing before you go looking: "which host is
# the top talker" is NOT answerable from this stack. That needs a flow store
# (ClickHouse and friends) — see docs/flow-analytics.md.

# READ BUFFER SIZING — the difference between "working" and "silently losing
# flow". Flow is UDP: an overflowing socket buffer drops datagrams with no
# error, no log line, and no retransmit. The only evidence is a rising
# RcvbufErrors count in `netstat -su` on the host, which nobody looks at.
#
# 8 MiB holds roughly a second of burst from a few hundred exporters. It also
# requires net.core.rmem_max to be at least this large on the HOST — the kernel
# silently clamps the request otherwise, and stock Ubuntu ships 212992 (208 KiB).
# scripts/preflight.sh and install.py both check this.

[[inputs.netflow]]
  service_address = "udp://:2055"           # NetFlow v5 / v9
  protocol = "netflow v9"
  read_buffer_size = "8MiB"

[[inputs.netflow]]
  service_address = "udp://:4739"           # IPFIX
  protocol = "ipfix"
  read_buffer_size = "8MiB"

# Keep only the tags that are bounded. Everything else — addresses, ports,
# flow ids, TCP flags — is discarded before it can become a label.
[[processors.override]]
  order = 3
  namepass = ["netflow"]
  taginclude = ["device", "site", "role", "protocol", "direction", "source"]

# Sum over a window so one series per (device, protocol, direction) is emitted
# per minute, instead of one sample per flow record.
[[aggregators.basicstats]]
  period = "60s"
  drop_original = true
  namepass = ["netflow"]
  stats = ["sum"]

[[processors.rename]]
  order = 4
  namepass = ["netflow"]
  [[processors.rename.replace]]
    field = "in_bytes_sum"
    dest = "flow_bytes_total"
  [[processors.rename.replace]]
    field = "in_packets_sum"
    dest = "flow_packets_total"
