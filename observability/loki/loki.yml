# Loki, single-binary, filesystem-backed. Sized for a demo, not a cluster.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1      # pin the ring; without it Loki picks an
  path_prefix: /loki            # interface and can fail to find itself
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION:-336h}
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # A low label cardinality is enforced here as a backstop. The Logstash
  # pipeline is supposed to emit only device/site/role/severity/vendor; if a
  # future edit starts promoting message fields to labels, ingestion fails
  # loudly instead of quietly filling the index with millions of streams.
  max_label_names_per_series: 12
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
