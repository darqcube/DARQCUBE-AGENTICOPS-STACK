apiVersion: 1
providers:
  - name: darqcube
    orgId: 1
    folder: DarqCube
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/darqcube

  # Generated by `make render` (render-network-map.py): the Network Map,
  # drawn from source-of-truth/map/. Same folder in the UI.
  - name: darqcube-generated
    orgId: 1
    folder: DarqCube
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/generated
