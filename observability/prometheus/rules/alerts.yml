# Alerts. Edit this file to add or change one, then: make restart SVC=prometheus
groups:
  - name: network-devices
    rules:
      # admin-up but oper-down: the operator wants it up and it isn't. An
      # interface that is deliberately shut is admin_status 2 and never fires.
      - alert: InterfaceDown
        expr: interface_oper_status == 2 and interface_admin_status == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} {{ $labels.ifName }} is down"
          description: "Admin-up but oper-down for 2 minutes. {{ $labels.ifAlias }}"

      - alert: InterfaceErrorRateHigh
        expr: rate(interface_in_errors[5m]) + rate(interface_out_errors[5m]) > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} {{ $labels.ifName }} error rate high"

      - alert: DeviceCPUHigh
        expr: device:cpu_usage:max > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} CPU at {{ $value | printf \"%.0f\" }}%"

      - alert: DeviceMemoryHigh
        expr: device:memory_used_percent:max > 90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} memory at {{ $value | printf \"%.0f\" }}%"

      # A device that was being polled and has stopped. Covers a dead device, a
      # broken SNMP credential and a management-path outage alike.
      - alert: DeviceUnreachable
        expr: up{job="telegraf"} == 1 and on() absent_over_time(device_uptime[5m])
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No SNMP data from any device for 5 minutes"
          description: "Telegraf is being scraped but no device is answering."

  - name: intent
    rules:
      # In Infrahub as active, but neither SNMP nor gNMI has heard from it.
      # The source of truth names the device, so the alert does too.
      - alert: DeviceNotReporting
        expr: device:not_reporting
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.device }} ({{ $labels.site }}) is in Infrahub but not reporting"
          description: "Active in the source of truth, no SNMP/gNMI data for 10 minutes. Check reachability, credentials and snmp_security."
      # A BGP session configured up (adminStatus start) that is not Established.
      - alert: BGPPeerDown
        expr: bgp_peer_state != 6 and on (device, peer) bgp_peer_admin_status == 2
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "BGP peer {{ $labels.peer }} on {{ $labels.device }} is not established"
          description: "bgpPeerState {{ $value }} (6 = established) for 5 minutes."

  - name: wan-quality
    rules:
      # IP SLA probes: a probe that keeps failing is a path (or service) that
      # is down from that site's point of view.
      - alert: IPSLAProbeFailing
        expr: ipsla:success:ratio15m < 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "IP SLA {{ $labels.probe }} on {{ $labels.device }} succeeds {{ $value | humanizePercentage }}"
          description: "Fewer than 80% of operations succeeded over 15 minutes — loss on the path, or the target is down."
      - alert: WANLatencyHigh
        expr: ipsla:rtt_ms:avg10m{rtt_type="1"} > 150
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "WAN RTT {{ $value | printf \"%.0f\" }} ms from {{ $labels.device }} ({{ $labels.probe }})"
          description: "10-minute average ICMP probe RTT above 150 ms. Adjust the threshold to the WAN's SLA."

  - name: flows
    rules:
      # Flow is device-initiated, so silence is the only symptom of an exporter
      # that has stopped. Nothing else in the stack would notice.
      - alert: NoFlowsReceived
        expr: absent_over_time(netflow_flow_bytes_total[15m])
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No NetFlow/IPFIX received for 15 minutes"
          description: "Check /ip traffic-flow or the device's flow export config."

      # A critical application (Infrahub criticality) that was carrying traffic
      # and has gone quiet: the service, its host or the path to it is likely
      # down. Needs services modelled in Infrahub; silent otherwise.
      - alert: CriticalApplicationSilent
        expr: |
          max by (application) (max_over_time(netflow_flow_bytes_total{criticality="critical"}[6h]) > 0)
            unless on (application)
          max by (application) (max_over_time(netflow_flow_bytes_total{criticality="critical"}[15m]))
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No traffic to critical application {{ $labels.application }} for 15 minutes"
          description: "It carried traffic in the last 6 hours. Check its hosts and services in Infrahub (get_application_dependencies)."

  - name: platform
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is down"

      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[10m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Prometheus rule evaluations are failing"
