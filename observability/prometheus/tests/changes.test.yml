# The change notification (rules/alerts.yml, group changes): ChangeWaitingForApproval fires one minute after a change
# starts waiting and clears when none waits (approved, rejected, withdrawn or expired).
#   docker run --rm -v "$PWD/observability/prometheus:/p:ro" --entrypoint promtool prom/prometheus test rules /p/tests/changes.test.yml
# Also run by automation/tests/test_render.py when Docker is available.
rule_files:
  - ../rules/alerts.yml
evaluation_interval: 30s
tests:
  - interval: 1m
    input_series:
      # Nothing waits for 5 minutes, two changes wait from minute 5 to 15, none after.
      - {series: 'changes{state="waiting",job="automation"}', values: '0x4 2x10 0x10'}
    alert_rule_test:
      - {eval_time: 4m, alertname: ChangeWaitingForApproval, exp_alerts: []}
      - {eval_time: 5m30s, alertname: ChangeWaitingForApproval, exp_alerts: []}   # not yet: for 1m
      - eval_time: 7m
        alertname: ChangeWaitingForApproval
        exp_alerts:
          - exp_labels: {severity: info}
            exp_annotations:
              summary: "2 device change(s) waiting for an approval"
              description: "An approver approves or rejects each one through the approvals path; unapproved, it expires."
      - {eval_time: 17m, alertname: ChangeWaitingForApproval, exp_alerts: []}
