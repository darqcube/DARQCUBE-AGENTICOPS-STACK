# ---------------------------------------------------------------------------
# Syslog -> parse -> enrich from the source of truth -> Loki
#
# Logstash owns syslog in this stack; Telegraf owns SNMP, gNMI and flow. The
# split is deliberate: syslog from three vendors is a parsing problem, and the
# translate filter below gives a real enrichment stage that reads the same
# Infrahub-derived identity table Telegraf uses.
# ---------------------------------------------------------------------------

input {
  udp {
    port => 514
    type => "syslog"

    # 8 MiB. REQUIRES net.core.rmem_max >= 8388608 on the HOST: the kernel
    # silently clamps a larger request, and stock Ubuntu ships 212992 (208 KiB)
    # — a 40x reduction that shows up only as dropped syslog under load, with
    # no error anywhere. scripts/preflight.sh and install.py check this.
    receive_buffer_bytes => 8388608

    # More receive threads: one thread cannot keep up with a few hundred
    # devices all logging during the same network event.
    workers => 4
  }
}

filter {
  # --- 1. Parse ------------------------------------------------------------
  # Patterns are tried in order and the first match wins, so the specific
  # vendor formats come before the catch-all. ANY_SYSLOG at the end means an
  # unrecognised line is still delivered rather than silently dropped — which
  # is what a stricter parser would do, and is the failure mode that wastes
  # the most time because nothing reports it.
  grok {
    patterns_dir => ["/usr/share/logstash/patterns"]
    match => {
      "message" => [
        "%{CISCO_SYSLOG}",
        "%{VRP_SYSLOG}",
        "%{ROS_SYSLOG}",
        "%{ROS_SYSLOG_NOHOST}",
        "%{ANY_SYSLOG}"
      ]
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  # --- 2. Severity ---------------------------------------------------------
  # Cisco and Huawei carry severity in the message body; RouterOS does not, so
  # it is derived from the PRI (pri = facility * 8 + severity).
  if [severity_code] {
    mutate { add_field => { "severity_num" => "%{severity_code}" } }
  } else if [pri] {
    ruby { code => "event.set('severity_num', (event.get('pri').to_i % 8).to_s)" }
  }

  translate {
    source => "[severity_num]"
    target => "[severity]"
    dictionary => {
      "0" => "emergency"
      "1" => "alert"
      "2" => "critical"
      "3" => "error"
      "4" => "warning"
      "5" => "notice"
      "6" => "info"
      "7" => "debug"
    }
    fallback => "unknown"
  }

  # --- 3. Enrich from the source of truth ----------------------------------
  # THIS IS THE INTERCONNECT. devices.yml is written by render-inventory.py
  # from Infrahub, and Telegraf reads the same table. It is why a log line and
  # a metric for the same device arrive with the same device/site/role labels.
  #
  # refresh_interval means `make render` propagates without a restart.
  # Match on the hostname the device sent; fall back to its source IP, which
  # covers a device whose hostname does not match its Infrahub name.
  translate {
    source => "[hostname]"
    target => "[sot]"
    dictionary_path => "/usr/share/logstash/lookup/devices.yml"
    refresh_interval => 60
    fallback => ""
  }
  if ![sot] or [sot] == "" {
    translate {
      source => "[host][ip]"
      target => "[sot]"
      dictionary_path => "/usr/share/logstash/lookup/devices.yml"
      refresh_interval => 60
      fallback => ""
    }
  }

  if [sot] and [sot] != "" {
    dissect {
      mapping => { "[sot]" => "%{device}|%{site}|%{role}|%{platform}" }
    }
  } else {
    # Reaching here means a device is sending logs but is NOT in Infrahub. The
    # log is kept — with the tag, so it is findable — because discarding it
    # would hide exactly the situation worth knowing about.
    # The catch-all pattern captures no hostname, so fall back explicitly
    # rather than leaving a literal "%{[hostname]}" as the device name.
    if ![hostname] {
      mutate { add_field => { "hostname" => "unparsed" } }
    }
    mutate {
      add_field => {
        "device"   => "%{[hostname]}"
        "site"     => "unknown"
        "role"     => "unknown"
        "platform" => "unknown"
      }
      add_tag => ["not_in_source_of_truth"]
    }
  }

  # --- 4. Trim -------------------------------------------------------------
  mutate {
    remove_field => ["sot", "severity_num", "severity_code", "pri", "seq",
                     "tz", "vrp_ver", "vrp_type", "type", "host", "event",
                     "@version", "message"]
  }
}

output {
  loki {
    url => "${LOKI_URL}"

    # LABEL DISCIPLINE — the single most important line in this file.
    # Only bounded, low-cardinality fields become Loki labels. `mnemonic`,
    # `topics` and the message body stay as content, searched with LogQL |=.
    # Promoting a mnemonic to a label multiplies stream count by the number of
    # distinct message types a device can emit, which makes Loki unusable at a
    # scale where it is too late to fix cheaply.
    include_fields => ["device", "site", "role", "severity", "platform"]

    message_field => "msg"
    batch_wait => 1
    batch_size => 102400
  }
}
