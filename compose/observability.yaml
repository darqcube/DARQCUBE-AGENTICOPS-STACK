# ---------------------------------------------------------------------------
# GROUP: observability — answers "what IS happening?"
#
# Ingest ownership, which is deliberate and should not be blurred:
#   Telegraf  SNMP (161) · gNMI (57400) · NetFlow/IPFIX (2055, 4739)  -> Prometheus
#   Logstash  syslog (514)                                            -> Loki
#
# Telegraf and Logstash both read the identity table that render-inventory.py
# writes into the shared `telegraf-generated` volume. That is what makes a
# metric and a log line arrive with the same device/site/role labels.
# ---------------------------------------------------------------------------

services:

  # Alertmanager has no environment-variable expansion of its own, so the one
  # value that must vary per install — where alerts are delivered — is
  # substituted here before Alertmanager starts. Runs once and exits.
  config-init:
    image: alpine:3.20
    labels:
      com.darqcube.group: observability
      com.darqcube.role: backend
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ../observability/alertmanager/alertmanager.yml.tmpl:/src/alertmanager.yml.tmpl:ro
      - alertmanager-config:/out
    command:
      - sh
      - -c
      - |
        url="${ALERT_WEBHOOK_URL:-}"
        if [ -z "$$url" ]; then
          # No external consumer configured. Point at Alertmanager's own health
          # endpoint so delivery succeeds and does nothing, rather than filling
          # the log with failures for an integration that was never set up.
          url="http://alertmanager:9093/-/ready"
          echo "ALERT_WEBHOOK_URL is empty — alerts stay in the Alertmanager UI only."
        else
          echo "Alerts will be delivered to $$url"
        fi
        sed "s|__ALERT_WEBHOOK_URL__|$$url|" /src/alertmanager.yml.tmpl > /out/alertmanager.yml
    restart: "no"
    networks: [darqcube]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.4.1}
    labels:
      com.darqcube.group: observability
      com.darqcube.role: store
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [darqcube]
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.5.1}
    labels:
      com.darqcube.group: observability
      com.darqcube.role: store
    command:
      - -config.file=/etc/loki/loki.yml
      # Without this, ${LOKI_RETENTION} is read literally and Loki refuses
      # to start with "not a valid duration string".
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-336h}
    volumes:
      - ../observability/loki:/etc/loki:ro
      - loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [darqcube]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.28.1}
    labels:
      com.darqcube.group: observability
      com.darqcube.role: api
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager-config:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    depends_on:
      config-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [darqcube]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.0.2}
    labels:
      com.darqcube.group: observability
      com.darqcube.role: ui
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"database\": *\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [darqcube]
    restart: unless-stopped

  telegraf:
    image: telegraf:${TELEGRAF_VERSION:-1.34}
    labels:
      com.darqcube.group: observability
      com.darqcube.role: collector
    profiles: [devices]
    command:
      - telegraf
      - --config=/etc/telegraf/telegraf.conf
      - --config-directory=/etc/telegraf/telegraf.d
      # POLL, not inotify. inotify does not fire reliably for files written
      # into a volume by another container, so a `make render` would be missed.
      - --watch-config=poll
      - --watch-interval=30s
    environment:
      SNMPV3_USER: ${SNMPV3_USER:-darqcube}
      SNMPV3_AUTH: ${SNMPV3_AUTH:?set in .env}
      SNMPV3_PRIV: ${SNMPV3_PRIV:?set in .env}
      SNMP_INTERVAL: ${SNMP_INTERVAL:-30s}
      GNMI_USER: ${GNMI_USER:-}
      GNMI_PASSWORD: ${GNMI_PASSWORD:-}
    volumes:
      - ../observability/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ../observability/telegraf/conf.d:/etc/telegraf/telegraf.d/static:ro
      # render-inventory.py output — the per-platform SNMP/gNMI configs and
      # the device identity table used by processors.lookup.
      - telegraf-generated:/etc/telegraf/telegraf.d/generated:ro
    ports:
      - "${NETFLOW_PORT:-2055}:2055/udp"   # NetFlow v5 / v9
      - "${IPFIX_PORT:-4739}:4739/udp"     # IPFIX
    healthcheck:
      test: ["CMD-SHELL", "telegraf --config /etc/telegraf/telegraf.conf --test --test-wait 1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    networks: [darqcube]
    restart: unless-stopped

  logstash:
    build:
      context: ../observability/logstash
    image: darqcube/logstash:local
    labels:
      com.darqcube.group: observability
      com.darqcube.role: collector
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - ../observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ../observability/logstash/patterns:/usr/share/logstash/patterns:ro
      # Same identity table Telegraf uses, read by the translate filter.
      - telegraf-generated:/usr/share/logstash/lookup:ro
    ports:
      - "${SYSLOG_PORT:-514}:514/udp"
    depends_on:
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/_node/stats >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    networks: [darqcube]
    restart: unless-stopped

volumes:
  alertmanager-config:
  prometheus-data:
  loki-data:
  alertmanager-data:
  grafana-data:
