# ---------------------------------------------------------------------------
# Infrahub schema — what SHOULD exist on the network.
#
# Load with: make schema
#
# TWO RULES WHEN EDITING THIS FILE:
#
# 1. Keep every `description:` UNDER 128 CHARACTERS. Infrahub rejects the whole
#    schema load with `string_too_long` and does NOT name the offending field,
#    so one long line costs an hour of bisecting.
#
# 2. Every attribute you add needs a `default_value` or `optional: true`.
#    A required attribute with no default makes every EXISTING node
#    non-compliant the moment the field lands.
#
# `make seed` reads its field list from this schema, so a new attribute or
# relationship is accepted from source-of-truth/devices/*.yml with no code
# change: edit here, `make schema`, then set the value in the YAML.
#
# Device credentials are deliberately NOT modelled here. They live in .env.
# Device SSH host keys ARE (ssh_host_keys): public, and the identity check
# every SSH session makes — see automation/hostkeys.py.
# ---------------------------------------------------------------------------
version: "1.0"

nodes:
  - name: Site
    namespace: Network
    label: Site
    description: A physical or logical location grouping devices.
    default_filter: name__value
    display_labels: [name__value]
    order_by: [name__value]
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        description: Short site identifier, used as a metric and log label.
      - name: description
        kind: Text
        optional: true
      - name: site_type
        kind: Dropdown
        default_value: branch
        description: What kind of location this is. A branch office is a site_type, not an Infrahub branch.
        choices:
          - name: hq
          - name: branch
          - name: datacenter
          - name: pop
          - name: lab
      - name: region
        kind: Text
        optional: true
        description: Free-text grouping, e.g. north. Used for onboarding batches and views, not as a label.
    relationships:
      - name: devices
        peer: NetworkDevice
        optional: true
        cardinality: many
        kind: Component
      - name: hosts
        peer: NetworkHost
        optional: true
        cardinality: many
        kind: Component
      - name: prefixes
        peer: NetworkPrefix
        optional: true
        cardinality: many
        kind: Component

  - name: Device
    namespace: Network
    label: Network Device
    description: A managed network device — polled, logged and automated.
    default_filter: name__value
    display_labels: [name__value]
    order_by: [name__value]
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        description: Must equal the device hostname/sysname/identity exactly.

      - name: role
        kind: Dropdown
        description: Function of the device. Becomes a metric and log label.
        choices:
          - name: core
          - name: distribution
          - name: access
          - name: wan
          - name: edge
          - name: firewall
          - name: core-wan
          - name: core-dc
          - name: internet-edge
          - name: branch-wan

      - name: platform
        kind: Dropdown
        description: Selects the entry in platforms.yml — OIDs, netmiko type.
        choices:
          - name: ios_xe
            label: Cisco IOS-XE
          - name: vrp
            label: Huawei VRP
          - name: routeros
            label: MikroTik RouterOS

      - name: management_ip
        kind: IPHost
        optional: true
        description: Address the stack polls and connects to, unless management_host is set.

      - name: management_host
        kind: Text
        optional: true
        description: DNS name to poll and connect to. Wins over management_ip. One of the two is required.

      - name: ssh_host_keys
        kind: TextArea
        optional: true
        description: Pinned SSH host public keys, one 'type base64' per line. Set by make pin-host-keys; kept by make seed.

      - name: environment
        kind: Dropdown
        default_value: production
        description: Deployment environment. A dropdown, not a tag, so a typo is rejected.
        choices:
          - name: production
          - name: staging
          - name: lab
          - name: demo

      - name: status
        kind: Dropdown
        default_value: active
        description: Only active devices are rendered into the collectors.
        choices:
          - name: active
          - name: provisioning
          - name: maintenance
          - name: decommissioned

      - name: telemetry_mode
        kind: Dropdown
        default_value: snmp
        description: Metrics transport. SNMP and gNMI are mutually exclusive.
        choices:
          - name: snmp
          - name: gnmi

      - name: snmp_security
        kind: Dropdown
        default_value: auth_priv
        description: SNMPv3 level. auth_no_priv only for images that cannot encrypt, e.g. Cisco L2 IOL.
        choices:
          - name: auth_priv
            label: authPriv (SHA + AES)
          - name: auth_no_priv
            label: authNoPriv (SHA only)

      - name: flow_enabled
        kind: Boolean
        default_value: false
        description: Device is expected to export NetFlow or IPFIX.

      - name: flow_port
        kind: Number
        optional: true
        description: Dedicated NetFlow port for an exporter behind NAT. Within FLOW_DEDICATED_FIRST..LAST.

      - name: description
        kind: Text
        optional: true

    relationships:
      - name: site
        peer: NetworkSite
        optional: false
        cardinality: one
        kind: Attribute
      - name: tags
        peer: BuiltinTag
        optional: true
        cardinality: many
        kind: Attribute
        description: Free-form grouping for people browsing. Never a metric or log label.

  # -------------------------------------------------------------------------
  # What the network serves. Optional: a deployment that models only devices
  # is unaffected. Seeded from source-of-truth/devices/*.yml like devices —
  # see docs/how-to/model-applications.md.
  # -------------------------------------------------------------------------
  - name: Prefix
    namespace: Network
    label: Prefix
    description: A subnet at a site — users, servers, transit or management.
    default_filter: name__value
    display_labels: [name__value]
    order_by: [name__value]
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        description: Short identifier, e.g. site-a-users.
      - name: prefix
        kind: IPNetwork
        optional: true
        description: The subnet in CIDR form, e.g. 10.10.1.0/24. Required by make seed.
      - name: purpose
        kind: Dropdown
        default_value: users
        description: What lives in the subnet.
        choices:
          - name: users
          - name: servers
          - name: transit
          - name: management
          - name: dmz
          - name: internet
      - name: vlan_id
        kind: Number
        optional: true
        description: VLAN carrying the subnet, if any.
      - name: description
        kind: Text
        optional: true
    relationships:
      - name: site
        peer: NetworkSite
        optional: true
        cardinality: one
        kind: Attribute
      - name: gateway
        peer: NetworkDevice
        optional: true
        cardinality: one
        kind: Attribute
        description: The device that routes for this subnet.
      - name: hosts
        peer: NetworkHost
        optional: true
        cardinality: many
        kind: Component

  - name: Host
    namespace: Network
    label: Host
    description: A non-network endpoint — server, workstation, gateway or appliance.
    default_filter: name__value
    display_labels: [name__value]
    order_by: [name__value]
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        description: Host name, e.g. srv-01.
      - name: host_type
        kind: Dropdown
        default_value: server
        description: What the host is.
        choices:
          - name: server
          - name: workstation
          - name: gateway
          - name: appliance
      - name: address
        kind: IPHost
        optional: true
        description: Primary IP address. Required when the host runs services.
      - name: operating_system
        kind: Text
        optional: true
        description: Operating system, free text.
      - name: environment
        kind: Dropdown
        default_value: production
        description: Deployment environment.
        choices:
          - name: production
          - name: staging
          - name: lab
          - name: demo
      - name: status
        kind: Dropdown
        default_value: active
        description: Lifecycle state.
        choices:
          - name: active
          - name: provisioning
          - name: maintenance
          - name: decommissioned
      - name: description
        kind: Text
        optional: true
    relationships:
      - name: site
        peer: NetworkSite
        optional: false
        cardinality: one
        kind: Attribute
      - name: prefix
        peer: NetworkPrefix
        optional: true
        cardinality: one
        kind: Attribute
      - name: services
        peer: NetworkService
        optional: true
        cardinality: many
        kind: Component
      - name: tags
        peer: BuiltinTag
        optional: true
        cardinality: many
        kind: Attribute
        description: Free-form grouping for people browsing. Never a metric or log label.

  - name: Application
    namespace: Network
    label: Application
    description: A business application, delivered by one or more services.
    default_filter: name__value
    display_labels: [name__value]
    order_by: [name__value]
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        description: Application name as people say it, e.g. erp.
      - name: category
        kind: Dropdown
        default_value: other
        description: Kind of application.
        choices:
          - name: web
          - name: code
          - name: database
          - name: file
          - name: mail
          - name: directory
          - name: dns
          - name: time
          - name: logging
          - name: collaboration
          - name: other
      - name: criticality
        kind: Dropdown
        default_value: medium
        description: Business impact if it is down.
        choices:
          - name: low
          - name: medium
          - name: high
          - name: critical
      - name: owner
        kind: Text
        optional: true
        description: Team or person responsible.
      - name: description
        kind: Text
        optional: true
    relationships:
      - name: services
        peer: NetworkService
        optional: true
        cardinality: many
        kind: Component

  - name: Service
    namespace: Network
    label: Service
    description: One listening endpoint — a protocol and port on a host, part of an application.
    default_filter: name__value
    display_labels: [name__value]
    order_by: [name__value]
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        description: Unique service name, e.g. srv-01-https.
      - name: protocol
        kind: Dropdown
        default_value: tcp
        description: Transport protocol.
        choices:
          - name: tcp
          - name: udp
      - name: port
        kind: Number
        optional: true
        description: Listening port, 1-65535. Required by make seed.
      - name: description
        kind: Text
        optional: true
    relationships:
      - name: host
        peer: NetworkHost
        optional: false
        cardinality: one
        kind: Attribute
      - name: application
        peer: NetworkApplication
        optional: false
        cardinality: one
        kind: Attribute
