# ---------------------------------------------------------------------------
# EXAMPLE network devices. Never seeded from here — copy it first:
#
#   cp source-of-truth/devices/examples/*.yml source-of-truth/devices/
#
# The copies are yours: gitignored, so `git pull` never touches them and they
# cannot be committed by accident. Edit them, then:
#
#   make seed      apply source-of-truth/devices/*.yml to Infrahub (idempotent)
#   make render    push the result into Telegraf and Logstash
#
# Both are needed: seed updates the source of truth, render updates the
# collectors. A device added without `make render` will never be polled.
#
# FIELDS
#   name             MUST equal the device's configured hostname / sysname /
#                    RouterOS identity. It is the key that joins a syslog line
#                    to a metric to an Infrahub record. A mismatch means logs
#                    arrive unlabelled and nothing correlates.
#   site             must exist in sites.yml
#   role             core | distribution | access | wan | edge | firewall
#                    | core-wan | core-dc | internet-edge | branch-wan
#   platform         ios_xe | vrp | routeros   (see platforms.yml)
#   management_ip    what the stack polls and SSHes to
#   management_host  optional DNS name; used INSTEAD of management_ip when set.
#                    One of the two is required.
#   environment      production (default) | staging | lab | demo
#   tags             optional list; each must exist under `tags:` in sites.yml
#   telemetry_mode   snmp (default) | gnmi — ios_xe only for gnmi
#   snmp_security    auth_priv (default) | auth_no_priv — only for images with no
#                    SNMP privacy support (Cisco L2 IOL). Polled from separate inputs.
#   flow_enabled     true if the device exports NetFlow/IPFIX
#   flow_port        optional; a dedicated NetFlow listener for an exporter behind
#                    NAT, within FLOW_DEDICATED_FIRST..LAST (docs/how-to/flow-behind-nat.md)
#   status           active (default) | provisioning | maintenance | decommissioned
#   latitude         optional Network Map position ('24.86'); empty = placed
#   longitude        around its site
#
# The allowed fields come from source-of-truth/schema/darqcube.yml. A field
# added there is accepted here after `make schema` — no code change. A field
# NOT in the schema fails `make seed`, so a typo cannot be silently dropped.
#
# This file is the whole record: a field left out is reset to its default on
# the next seed, even if it was set in the Infrahub UI.
#
# The three below are made up. Replace them with your real devices.
# ---------------------------------------------------------------------------
devices:
  - name: cr1
    site: hq
    role: core
    platform: ios_xe
    management_ip: 10.0.0.11
    telemetry_mode: snmp
    flow_enabled: true
    description: Core router

  - name: sw-hw-01
    site: hq
    role: access
    platform: vrp
    management_ip: 10.0.0.21
    flow_enabled: false
    description: Huawei access switch

  - name: mt-01
    site: branch-01
    role: wan
    platform: routeros
    management_ip: 10.0.0.31
    flow_enabled: true
    description: MikroTik WAN router
