# EXAMPLE sites and tags. Never seeded from here — copy it first:
#
#   cp source-of-truth/devices/examples/*.yml source-of-truth/devices/
#
# then edit the copy and run `make seed`. It is idempotent, so re-running
# updates existing sites rather than duplicating them.
#
# Every *.yml in source-of-truth/devices/ is read, so a large fleet can be
# split into one file per region or site. A name may be defined only once
# across all of them.
#
# SITE FIELDS (the full list is whatever source-of-truth/schema/darqcube.yml says)
#   name         short identifier — becomes the `site` metric and log label
#   site_type    hq | branch | datacenter | pop | lab   (default branch)
#   region       optional free text, e.g. north
#   description  optional
#
# TAGS are free-form labels for grouping devices in the Infrahub UI. A device
# may only use a tag listed here (or already created in Infrahub), so a typo
# fails `make seed` instead of quietly creating a second tag.
tags: []
#  - name: pci
#    description: In scope for PCI audit

sites:
  - name: hq
    site_type: hq
    description: Head office

  - name: branch-01
    site_type: branch
    description: Branch site 1
