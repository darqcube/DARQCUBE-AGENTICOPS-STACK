# ---------------------------------------------------------------------------
# EXAMPLE hosts (servers, workstations, gateways). Never seeded from here — copy it first:
#
#   cp source-of-truth/devices/examples/*.yml source-of-truth/devices/
#
# Optional: a deployment that models only devices can leave these out.
# Hosts, applications, services and prefixes describe what the network
# serves — see docs/how-to/model-applications.md.
#
# Fields:
#   name         unique
#   site         required; must exist in sites.yml
#   host_type    server (default) | workstation | gateway | appliance
#   address      IP; required if the host runs services, inside its prefix
#   prefix       optional; must exist in prefixes.yml
#   operating_system, description, environment, status, tags — as for devices
# ---------------------------------------------------------------------------

hosts:
  - name: srv-web-01
    site: hq
    host_type: server
    address: 10.0.10.11
    prefix: hq-servers
    operating_system: linux

  - name: srv-db-01
    site: hq
    host_type: server
    address: 10.0.10.12
    prefix: hq-servers
    operating_system: linux

  - name: ws-branch-01
    site: branch-01
    host_type: workstation
    address: 10.0.11.21
    prefix: branch-01-users
